# ShariaFunds on Spring Boot (replaces web.xml and the WildFly datasource)

# Local use only: listen on this PC, keep the WildFly-era URL /ShariaFunds
server.address=127.0.0.1
server.port=8080
server.servlet.context-path=/ShariaFunds
server.servlet.session.timeout=30m

# Database: test copy during the migration. Credentials come from the environment
# (DB_USERNAME / DB_PASSWORD) and are never stored in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ShariaFunds_migration}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Faces
# Same mappings the WildFly JSF 2.2 implicit registration used
joinfaces.faces-servlet.url-mappings=/faces/*,*.jsf,*.faces
server.servlet.context-parameters.jakarta.faces.DATETIMECONVERTER_DEFAULT_TIMEZONE_IS_SYSTEM_TIMEZONE=true
