<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.company_cfg_list}' />
	<ui:param name="subtitle" value='#{bundle.company_cfg_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>

	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.configurations}</li>
		<li class="breadcrumb-item active">#{bundle.company_cfg_list}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">


		<ui:remove>
			<p:remoteCommand name="goTolastPage"
				action="#{companyCfgController.getFirstRowInLastPage('companyCfgTableId')}"
				update=":#{p:component('companyCfgTableId')}" />
		</ui:remove>

		<div class="card" style="margin-top: 10px;">






			<div class="card-body">



				<div class="row">

					<div class="col-md-2">
						<span style="font-size: 16px;"><p:spacer width="5" />
							#{bundle.company_cfg_list} :</span> <span style="font-size: 16px;"
							class="label label-warning countClass" id="countId">#{companyCfgController.countItems}
						</span>
					</div>



					<h:panelGroup id="save-form" class="col-md-10">
						<h:commandLink value='#{bundle.save}' id="btn-save"
							style="float:left;margin-left:5px;"
							action='#{companyCfgController.save()}'
							styleClass="btn btn-primary waves-effect waves-light btn-save">
							<f:ajax render=" :messageScript companyCfgTableId conter-top"
								execute="save-form companyCfgTableId" />
						</h:commandLink>

						<p:tooltip id="toolTipGrow" for="btn-save"
							atPosition="right center" value="#{bundle.ctrl_s}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>


			</div>



			<p:dataTable
				currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
				emptyMessage="#{bundle.no_records}" editable="true"
				id="companyCfgTableId" paginator="true" paginatorPosition="bottom"
				paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
				rowKey="#{item.id}" rows="10" style="margin-top:15px;"
				rowsPerPageTemplate="10,20,30,#{companyCfgController.pageItems.size()}"
				rowStyleClass="#{item.error ? 'error-record' :'' }   #{item.forDelete ? 'removed':''}"
				tableStyleClass="removed-row-table" rowIndexVar="index"
				styleClass="table table-striped table-hover"
				value="#{companyCfgController.pageItems}" var="item"
				widgetVar="pageItemsTableWgVar">

				<p:column width="10">

					<f:facet name="header">
						<h:commandLink immediate="true" id="btn-new"
							actionListener="#{companyCfgController.add()}"
							styleClass="btn btn-primary   waves-effect waves-light btn-xs   btn-new ">
							<i class=" dripicons-plus " style="color: white;"></i>

							<p:ajax update="#{p:component('companyCfgTableId')}"></p:ajax>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-new"
							atPosition="right center" value="#{bundle.ctrl_z}"
							showEffect="slide" hideEffect="slide" position="right" />
					</f:facet>

					<h:commandLink immediate="true" onclick="toggleRemove(#{index})"
						actionListener="#{companyCfgController.delete(item)}"
						style="margin-top:1%; margin-bottom:1%;margin-left:1%"
						styleClass="btn btn-danger waves-effect waves-light btn-xs ">
						<f:ajax></f:ajax>
						<i class=" dripicons-trash " style="color: white;" />
					</h:commandLink>

					<h:commandLink
						styleClass="btn btn-warning  waves-effect waves-light  btn-xs"
						actionListener="#{companyCfgController.editRow(item)}">
						<span class=" dripicons-document-edit  " style="color: white;" />
						<f:ajax render="companyNameId"></f:ajax>
					</h:commandLink>

				</p:column>

				<p:column headerText="#{bundle.company_company_name}"
					sortBy="#{item.name}" width="90">
					<h:inputText id="companyNameId" disabled="#{item.saved}"
						styleClass="text-ellipsis form-control" title="#{item.name}"
						value="#{item.name}"
						style="margin-right: 20%; width: 50%;  #{item.saved ? 'color: #007bff; font-weight: 700;' :''}"
						label="#{bundle.company_company_name}">
						<f:ajax></f:ajax>
					</h:inputText>
				</p:column>

			</p:dataTable>
		</div>


		<script type="text/javascript"> 
	
	function toggleRemove( index) {
		
		$('.ui-widget-content.ui-datatable-odd[data-ri="' + index +'"]').toggleClass('removed'); 
		
		$('.ui-widget-content.ui-datatable-even[data-ri="' + index +'"]').toggleClass('removed'); 
	}
</script>

	</ui:define>
</ui:composition>

</html>
