<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.company_cfg_list}' />
	<ui:param name="subtitle" value='#{bundle.company_cfg_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>

	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.configurations}</li>
		<li class="breadcrumb-item active">#{bundle.religion_reference_cfg_list}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">



		<div class="card">

			<div class="card-body">



				<div class="row">

					<h:panelGroup id="conter-top" class="col-md-2">

						<span class="sf-list-title">
							#{bundle.religion_reference_cfg_list} :</span>
						<span style="font-size: 16px;"
							class="label label-warning countClass" id="countId">#{religionReferenceCfgController.countItems}
						</span>

					</h:panelGroup>
					<h:panelGroup id="save-form" class="col-md-10">
						<h:commandLink value='#{bundle.save}' id="btn-save"
							style="float:left;margin-left:5px;"
							action='#{religionReferenceCfgController.save()}'
							styleClass="btn btn-primary waves-effect waves-light btn-save">
							<f:ajax
								render=" :messageScript religionReferenceCfgTableId conter-top"
								execute="save-form religionReferenceCfgTableId" />
							<i class="fa fa-save" />
						</h:commandLink>

						<p:tooltip id="toolTipGrow" for="btn-save"
							atPosition="right center" value="#{bundle.ctrl_s}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>


			</div>



			<ui:remove>
				<p:remoteCommand name="goTolastPage"
					action="#{religionReferenceCfgController.getFirstRowInLastPage('religionReferenceCfgTableId')}"
					update="@root:@id(religionReferenceCfgTableId)" />
			</ui:remove>

			<p:dataTable
				currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
				emptyMessage="#{bundle.no_records}" editable="true"
				id="religionReferenceCfgTableId" paginator="true"
				paginatorPosition="bottom" style="margin-top:15px;"
				paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
				rowKey="#{item.id}" rows="10"
				rowsPerPageTemplate="10,20,30,#{religionReferenceCfgController.pageItems.size()}"
				rowStyleClass="#{item.error ? 'error-record' :'' }   #{item.forDelete ? 'removed':''}"
				tableStyleClass="removed-row-table" rowIndexVar="index"
				styleClass="table table-striped table-hover"
				value="#{religionReferenceCfgController.pageItems}" var="item"
				widgetVar="pageItemsTableWgVar">

				<p:column width="10">

					<f:facet name="header">


						<h:commandLink immediate="true" id="btn-new"
							actionListener="#{religionReferenceCfgController.add()}"
							styleClass="btn btn-primary   waves-effect waves-light btn-xs  btn-new  ">
							<i class=" dripicons-plus " style="color: white;"></i>

							<p:ajax update="@root:@id(religionReferenceCfgTableId)"></p:ajax>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-new"
							atPosition="right center" value="#{bundle.ctrl_z}"
							showEffect="slide" hideEffect="slide" position="right" />


					</f:facet>
					<h:commandLink title="#{bundle.delete}" immediate="true" onclick="toggleRemove(#{index})"
						actionListener="#{religionReferenceCfgController.delete(item)}"
						style="margin-top:1%; margin-bottom:1%"
						styleClass="btn btn-danger waves-effect waves-light btn-xs">
						<f:ajax></f:ajax>
						<i class=" dripicons-trash " style="color: white;" />
					</h:commandLink>

				</p:column>

				<p:column headerText="#{bundle.relegion_reference_cfg_name}"
					sortBy="#{item.name}" width="90">



					<h:inputText id="healthyNameId" disabled="#{item.saved}"
						styleClass="text-ellipsis form-control" title="#{item.name}"
						value="#{item.name}" style="    margin-right: 20%; width: 50%; #{item.saved ? 'color: #007bff; font-weight: 700;' :''}"
						label="#{bundle.relegion_reference_cfg_name}">>
						<f:ajax></f:ajax>
					</h:inputText>
				</p:column>
			</p:dataTable>
		</div>
		<script type="text/javascript"> 
	
	function toggleRemove( index) {
		
		$('.ui-widget-content.ui-datatable-odd[data-ri="' + index +'"]').toggleClass('removed'); 
		
		$('.ui-widget-content.ui-datatable-even[data-ri="' + index +'"]').toggleClass('removed'); 
	}
</script>

	</ui:define>
</ui:composition>

</html>
