<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.company_cfg_list}' />
	<ui:param name="subtitle" value='#{bundle.company_cfg_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>

	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active"><h:link
				outcome="configuration">#{bundle.configurations}</h:link></li>
		<li class="breadcrumb-item active">#{bundle.service_list}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">
		<div class="card">
			<div class="card-body">
				<div class="row">
					<h:panelGroup id="conter-top" class="col-md-3">
						<span class="sf-list-title">
							#{bundle.service_list} :</span>
						<span style="font-size: 16px;"
							class="label label-warning countClass" id="countId">#{serviceController.count}
						</span>
					</h:panelGroup>
					<h:panelGroup id="save-form" class="col-md-9">
						<h:commandLink value='#{bundle.save}' id="btn-save"
							style="float:left;margin-left:5px;"
							action='#{serviceController.save()}'
							styleClass="btn btn-primary waves-effect waves-light btn-save">
							<f:ajax render=" :messageScript serviceTableId conter-top"
								execute="save-form serviceTableId" />
							<i class="fa fa-save" />
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-save"
							atPosition="right center" value="#{bundle.ctrl_s}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>
			</div>
			<p:dataTable
				currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
				emptyMessage="#{bundle.no_records}" editable="true"
				id="serviceTableId" paginator="true" paginatorPosition="bottom"
				style="margin-top:15px;"
				paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
				rowKey="#{item.id}" rows="10"
				rowsPerPageTemplate="10,20,30,#{serviceController.pageItems.size()}"
				rowStyleClass="#{ item.error ? 'error-record' :'' }   #{item.forDelete ? 'removed':''}"
				tableStyleClass="removed-row-table" rowIndexVar="index"
				styleClass="table table-striped table-hover"
				value="#{serviceController.pageItems}" var="item"
				widgetVar="pageItemsTableWgVar">
				<p:column width="10">
					<f:facet name="header">
						<h:commandLink immediate="true" id="btn-new"
							actionListener="#{serviceController.add()}"
							styleClass="btn btn-primary   waves-effect waves-light btn-xs  btn-new  ">
							<i class=" dripicons-plus " style="color: white;"></i>

							<p:ajax update="@root:@id(serviceTableId)"></p:ajax>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-new"
							atPosition="right center" value="#{bundle.ctrl_z}"
							showEffect="slide" hideEffect="slide" position="right" />

					</f:facet>
					<h:commandLink title="#{bundle.delete}" immediate="true" onclick="toggleRemove(#{index})"
						actionListener="#{serviceController.delete}"
						style="margin-top:1%; margin-bottom:1%"
						styleClass="btn btn-danger waves-effect waves-light btn-xs">
						<f:attribute name="rowId" value="#{index}" />
						<f:ajax render=":messageScript"></f:ajax>
						<i class=" dripicons-trash " style="color: white;" />
					</h:commandLink>
				</p:column>
				<p:column headerText=" #{bundle.service_name}" sortBy="#{item.name}"
					width="90">
					<h:inputText id="serviceNameId" styleClass="text-ellipsis"
						title="#{item.name}" value="#{item.name}" disabled="#{item.saved}"
						style="  margin-right: 20%; width: 50%; #{item.saved ? 'color: #007bff; font-weight: 700;' :''}"
						label="#{bundle.service_name}">
						<f:ajax execute="@this"></f:ajax>
					</h:inputText>
				</p:column>
				<p:column headerText=" #{bundle.service_counted}"
					sortBy="#{item.counted}" width="90">
					<div class="skin">
						<h:selectBooleanCheckbox label="#{bundle.service_counted}"
							style="height:20px;width:25px" id="countedId"
							value="#{item.counted}" disabled="#{item.saved}">
						</h:selectBooleanCheckbox>
					</div>
				</p:column>
			</p:dataTable>
		</div>

		<script type="text/javascript"> 
	
	function toggleRemove( index) {
		
		$('.ui-widget-content.ui-datatable-odd[data-ri="' + index +'"]').toggleClass('removed'); 
		
		$('.ui-widget-content.ui-datatable-even[data-ri="' + index +'"]').toggleClass('removed'); 
	}
</script>

	</ui:define>
</ui:composition>

</html>
