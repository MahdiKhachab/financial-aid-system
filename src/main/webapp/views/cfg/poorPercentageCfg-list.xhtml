<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.insurance_party_list}' />
	<ui:param name="subtitle" value='#{bundle.insurance_party_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>

	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.configurations}</li>
		<li class="breadcrumb-item active">#{bundle.poor_percentage_cfg_list}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">


		<div class="card" style="margin-top: 10px;">

			<div class="card-body">



				<div class="row">

					<h:panelGroup id="conter-top" class="col-md-4">

						<span style="font-size: 16px;"><p:spacer width="5" />
							#{bundle.poor_percentage_cfg_list} :</span>
						<span style="font-size: 16px;"
							class="label label-warning countClass" id="countId">#{poorPercentageCfgController.countItems}
						</span>

					</h:panelGroup>
					<h:panelGroup id="save-form" class="col-md-8">
						<h:commandLink value='#{bundle.save}' id="btn-save"
							style="float:left;margin-left:5px;"
							action='#{poorPercentageCfgController.save()}'
							styleClass="btn btn-primary waves-effect waves-light btn-save">
							<f:ajax render=":messageScript tablePanelId"
								execute="tablePanelId" />
							<i class="fa fa-save" />
						</h:commandLink>

						<p:tooltip id="toolTipGrow" for="btn-save"
							atPosition="right center" value="#{bundle.ctrl_s}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>


			</div>


			<ui:remove>
				<p:remoteCommand name="goTolastPage"
					action="#{poorPercentageCfgController.getFirstRowInLastPage('PoorPercentageCfgTableId')}"
					update="@root:@id(PoorPercentageCfgTableId)" />
			</ui:remove>
			<h:panelGroup id="tablePanelId">
				<p:dataTable
					currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
					emptyMessage="#{bundle.no_records}" editable="true"
					id="PoorPercentageCfgTableId" paginator="true"
					paginatorPosition="bottom" style="margin-top:15px; "
					paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
					rowKey="#{item.id}" rows="10"
					rowsPerPageTemplate="10,20,30,#{poorPercentageCfgController.pageItems.size()}"
					rowStyleClass="#{item.error ? 'error-record' :'' }   #{item.forDelete ? 'removed':''}"
					tableStyleClass="removed-row-table" rowIndexVar="index"
					styleClass="table table-striped table-hover"
					value="#{poorPercentageCfgController.pageItems}" var="item"
					widgetVar="pageItemsTableWgVar">

					<p:column width="10">

						<f:facet name="header">

							<h:commandLink immediate="true" id="btn-new"
								actionListener="#{poorPercentageCfgController.add()}"
								styleClass="btn btn-primary   waves-effect waves-light btn-xs  btn-new  ">
								<i class=" dripicons-plus " style="color: white;"></i>

								<p:ajax update="@root:@id(PoorPercentageCfgTableId)"></p:ajax>
							</h:commandLink>
							<p:tooltip id="toolTipGrow" for="btn-new"
								atPosition="right center" value="#{bundle.ctrl_z}"
								showEffect="slide" hideEffect="slide" position="right" />

						</f:facet>
						<h:commandLink immediate="true" onclick="toggleRemove(#{index})"
							actionListener="#{poorPercentageCfgController.delete(item)}"
							style="margin-top:1%; margin-bottom:1%"
							styleClass="btn btn-danger waves-effect waves-light btn-xs">
							<f:ajax></f:ajax>
							<i class=" dripicons-trash " style="color: white;" />
						</h:commandLink>

					</p:column>

					<p:column headerText="#{bundle.poor_precentage_cfg_description}"
						sortBy="#{item.description}" width="90">
						<p:inputText id="inssuranceNameId" styleClass="text-ellipsis "
							style="    margin-right: 20%; width: 50%;"
							title="#{item.description}" value="#{item.description}"
							label="#{bundle.poor_precentage_cfg_description}">
							<f:ajax></f:ajax>
						</p:inputText>
					</p:column>

					<p:column headerText="#{bundle.poor_precentage_cfg_from}"
						sortBy="#{item.from}" width="90">
						<p:inputNumber id="poorFromId" decimalPlaces="0" maxValue="90"
							style="    margin-right: 20%; width: 50%;"
							styleClass="text-ellipsis " title="#{item.from}"
							value="#{item.from}" label="#{bundle.poor_precentage_cfg_from}">
							<f:ajax execute="tablePanelId"
								listener="#{poorPercentageCfgController.validationIntersectionValues(item)}"
								render="@this poorToId :messageScript" />
						</p:inputNumber>
					</p:column>

					<p:column headerText="#{bundle.poor_precentage_cfg_to}"
						sortBy="#{item.to}" width="90">



						<p:inputNumber id="poorToId" decimalPlaces="0" maxValue="100"
							style="margin-right: 20%; width: 50%;"
							styleClass="text-ellipsis " title="#{item.to}" value="#{item.to}"
							label="#{bundle.poor_precentage_cfg_to}">
							<f:ajax execute="tablePanelId"
								listener="#{poorPercentageCfgController.validationIntersectionValues(item)}"
								render="@this poorFromId :messageScript" />
						</p:inputNumber>
					</p:column>

				</p:dataTable>
			</h:panelGroup>
		</div>
		<script type="text/javascript"> 
	
	function toggleRemove( index) {
		
		$('.ui-widget-content.ui-datatable-odd[data-ri="' + index +'"]').toggleClass('removed'); 
		
		$('.ui-widget-content.ui-datatable-even[data-ri="' + index +'"]').toggleClass('removed'); 
	}
</script>

	</ui:define>
</ui:composition>

</html>
