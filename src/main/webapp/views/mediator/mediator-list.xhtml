<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:f5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.deserved_list}' />
	<ui:param name="subtitle" value='#{bundle.deserved_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>
	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.configurations}</li>
		<li class="breadcrumb-item active">#{bundle.mediator_list}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">
		<o:onloadScript>
     initDatePicker();
       </o:onloadScript>
		<o:importConstants type="enums.CurrencyEnum" var="currency" />
		<o:importConstants type="enums.MediatorMonyEnum" />
		<div class="card" style="margin-top: 10px;">
			<div class="card-body">
				<div class="row">

					<div id="conter-top" class="col-md-4">
						<span style="font-size: 16px;"><p:spacer width="5" />
							#{bundle.mediator_list} :</span>
						<div class="avatar-box thumb-sm align-self-center mr-2">
							<span id="countId" class="avatar-title rounded-circle"
								style="color: white !important; background-color: #0069d9 !important;">
								#{mediatorListController.countItems} </span>
						</div>
					</div>

					<div id="save-form" class="col-md-8">
						<h:commandLink action='mediator-card' id="btn-to-crud"
							styleClass="btn btn-primary waves-effect waves-light btn-crud-page"
							style="float:left;margin-left:5px;">
							<i class="fa fa-plus"></i>
							<span>#{bundle.mediator_add_new}</span>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-to-crud"
							atPosition="right center" value="#{bundle.ctrl_x}"
							showEffect="slide" hideEffect="slide" position="right" />
					</div>
				</div>
			</div>
			<h:panelGroup id="tablePanelId">
				<div class="row col-md-12"
					style="margin-left: 8px; margin-top: 10px;">
					<p:dataTable

						currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
						emptyMessage="#{bundle.no_records}"
						filteredValue="#{mediatorListController.filteredList}"
						id="tableId" paginator="true" paginatorPosition="bottom"
						paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
						rowKey="#{item.id}" rows="10"
						rowsPerPageTemplate="10,20,30,#{mediatorListController.pageItems.size()}"
						styleClass="table table-striped table-hover"
						value="#{mediatorListController.pageItems}" var="item"
						widgetVar="pageItemsTableWgVar" rowExpandMode="single">

						<p:ajax event="rowToggle"
							listener="#{mediatorListController.select(item)}" />
						<p:column styleClass="toggler" id="relatedFileToggler" width="30"
							exportable="false">
							<p:rowToggler />
						</p:column>
						<p:ajax event="rowEdit" update=":messageScript" />

						<p:column styleClass="no-header table-actions-column" width="150">
							<p:commandLink
								actionListener="#{mediatorListController.delete(item)}"
								style="margin-left:5px;"
								styleClass="btn btn-danger waves-effect waves-light btn-xs">
								<i class=" dripicons-trash  "
									style="color: white; font-size: 11px;" />
								<p:confirm header="#{bundle.delete}"
									message="#{bundle.are_you_sure_from_delete}">
								</p:confirm>
								<p:ajax oncomplete="PF('pageItemsTableWgVar').filter()"
									update=":messageScript">
								</p:ajax>
							</p:commandLink>
							<h:link outcome="/views/mediator/mediator-card.xhtml"
								rendered="#{item.attachmentList.size() eq 0}"
								styleClass="btn btn-warning  waves-effect waves-light  btn-xs">
								<f:param name="id" value="#{item.id}" />
								<span class=" dripicons-document-edit  " style="color: white;" />
								<f:ajax></f:ajax>
							</h:link>
						</p:column>

						<p:column filterBy="#{item.delegateName}"
							filterMatchMode="contains" headerText="#{bundle.mediator_name}"
							sortBy="#{item.delegateName}" width="150">
							<f:facet name="filter">
								<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
									placeholder="#{bundle.mediator_name}"
									styleClass="inputtext-filter" />
							</f:facet>
							<h:outputText id="delegateNameId" styleClass="text-ellipsis"
								title="#{item.delegateName}" value="#{item.delegateName}" />
						</p:column>

						<p:column headerText="#{bundle.mediator_phone_number}"
							sortBy="#{item.delegateName}" width="150">
							<h:outputText id="phoneNo" styleClass="text-ellipsis"
								title="#{item.phoneNo}" value="#{item.phoneNo}" />
						</p:column>

						<p:column filterBy="#{item.ammount}" filterMatchMode="contains"
							headerText="#{bundle.mediator_ammount}" sortBy="#{item.ammount}"
							width="150">
							<f:facet name="filter">
								<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
									onkeypress="return isNumberKey(event)"
									placeholder="#{bundle.mediator_ammount}"
									styleClass="inputtext-filter" />
							</f:facet>
							<h:outputText id="ammountId" styleClass="text-ellipsis"
								title="#{item.ammount}" value="#{item.ammount}">
								<f:convertNumber pattern="###,###,###" />
							</h:outputText>
						</p:column>

						<p:column filterBy="#{item.currency.type}"
							filterMatchMode="contains"
							headerText="#{bundle.mediator_currency}"
							sortBy="#{item.currency.type}" width="150">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
									style="width:100% ;   " styleClass="inputtext-filter">
									<f:selectItem itemLabel="العملات" itemValue="#{null}"
										noSelectionOption="true" />
									<f:selectItems value="#{currency.values()}" var="iCurrency"
										itemLabel="#{iCurrency.type}" itemValue="#{iCurrency.type}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText id="currencyId" styleClass="text-ellipsis"
								title="#{item.currency.type}" value="#{item.currency.type}" />
						</p:column>

						<p:column filterBy="#{item.monyEnum.type}"
							filterMatchMode="contains"
							headerText="#{bundle.mediator_money_type}"
							sortBy="#{item.monyEnum.type}" width="160">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
									style="width:100% ;   " styleClass="inputtext-filter">
									<f:selectItem itemLabel="نوع المساعدة" itemValue="#{null}"
										noSelectionOption="true" />
									<f:selectItems value="#{MediatorMonyEnum.values()}" var="money"
										itemLabel="#{money.type}" itemValue="#{money.type}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText id="moneyTypeId" styleClass="text-ellipsis"
								title="#{item.monyEnum.type}" value="#{item.monyEnum.type}" />
						</p:column>

						<p:column filterBy="#{item.toCompany.name}"
							filterMatchMode="startsWith" sortBy="#{item.toCompany.name}"
							width="180" headerText="#{bundle.mediator_to_company_name}">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
									style="width:100% ;   " styleClass="inputtext-filter">
									<f:selectItem itemLabel="#{bundle.mediator_to_company_name}"
										itemValue="#{null}" noSelectionOption="true" />
									<f:selectItems value="#{mediatorListController.companies}"
										var="company" itemLabel="#{company.name}"
										itemValue="#{company.name}" />
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{item.toCompany.name}"
								styleClass="text-ellipsis" title="#{item.toCompany.name}"></h:outputText>
						</p:column>

						<p:column filterBy="#{item.delivered}" filterMatchMode="exact"
							headerText="#{bundle.mediator_delivered}"
							sortBy="#{item.delivered}" width="180">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
									converter="jakarta.faces.Boolean" style="width:100% ;   "
									styleClass="inputtext-filter">
									<f:selectItem itemLabel="الجميع" itemValue="#{null}"
										noSelectionOption="true" />
									<f:selectItem itemLabel="#{bundle.no}" itemValue="false" />
									<f:selectItem itemLabel="#{bundle.yes}" itemValue="true" />
									<f:ajax></f:ajax>
								</p:selectOneMenu>
							</f:facet>
							<h:outputText
								styleClass="#{item.delivered ? 'em em-white_check_mark' : 'em em-x'}"
								value="" />
						</p:column>

						<p:column headerText="#{bundle.mediator_receiever}"
							sortBy="#{item.receiverOfCompany}" width="150"
							filterBy="#{item.receiverOfCompany}" filterMatchMode="contains">

							<f:facet name="filter">
								<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
									placeholder="#{bundle.mediator_receiever}"
									styleClass="inputtext-filter" />
							</f:facet>
							<h:outputText id="receiverId" styleClass="text-ellipsis"
								title="#{item.receiverOfCompany}"
								value="#{item.receiverOfCompany}">
							</h:outputText>
						</p:column>

						<p:column headerText="#{bundle.mediator_receive_date}"
							sortBy="#{item.receiveDate}" width="150"
							style="padding-bottom: 45px;">
							<h:outputText id="dateId" styleClass="text-ellipsis"
								title="#{item.receiveDate}" value="#{item.receiveDate}">
								<f:convertDateTime pattern="dd/MM/yyyy" />
							</h:outputText>
						</p:column>

						<p:rowExpansion>
							<div class="card" style="margin-top: 10px;">
								<div class="card-body">
									<div class="row">

										<ul class="nav nav-pills mb-3 nav-justified" id="pills-tab"
											role="tablist">
											<li class="nav-item"><a class="nav-link active"
												id="general_chat_tab" data-toggle="pill"
												href="#general_chat">#{bundle.related_files}</a></li>
										</ul>
									</div>
									<div class="row">
										<div class="tab-pane fade active show" id="general_chat"
											style="width: 80%">
											<p:dataTable id="attachmentsProjectDataTable"
												widgetVar="attachmentProjectVar" rows="5" paginator="true"
												rowsPerPageTemplate="5,10" paginatorAlwaysVisible="false"
												paginatorPosition="bottom"
												value="#{mediatorListController.mediator.attachmentList}"
												var="attachment" rowKey="#{attachment.id}"
												rowIndexVar="index" editable="true" editMode="cell">

												<p:column styleClass="no-header table-actions-column"
													width="50">
													<p:commandLink
														actionListener="#{mediatorListController.deleteAttachment(attachment)}"
														style="margin-left:5px;"
														styleClass="btn btn-danger waves-effect waves-light btn-xs">
														<i class=" dripicons-trash  "
															style="color: white; font-size: 11px;" />
														<p:confirm header="#{bundle.delete}"
															message="#{bundle.are_you_sure_from_delete}">
														</p:confirm>
														<p:ajax oncomplete="PF('attachmentProjectVar').filter()"
															update=":messageScript">
														</p:ajax>
													</p:commandLink>
												</p:column>

												<p:column headerText="Name" id="attachmentName" width="80">
													<h:outputText styleClass="badge badge-soft-purple"
														value="#{attachment.fileName}"
														title="#{attachment.fileName}" />
												</p:column>

												<p:column id="attachmentSize" headerText="Size"
													style="text-align: center" width="80">
													<h:outputText styleClass="badge badge-primary mb-2"
														value="#{attachment.sizeInMegaByte}"
														title="#{attachment.sizeInMegaByte}" />
												</p:column>

												<p:column width="50">
													<h:commandLink
														action="#{mediatorListController.download(attachment)}"
														styleClass="btn btn-sm btn-warning">
														<i class="fa fa-download white" />
													</h:commandLink>
												</p:column>
											</p:dataTable>
										</div>
										<div class="tab-pane fade active show" id="group_chat">
										</div>
									</div>
								</div>
							</div>
						</p:rowExpansion>

					</p:dataTable>
				</div>
			</h:panelGroup>

		</div>
		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<h:commandLink value='#{bundle.yes}'
				style="margin-left:10px  ; margin-top:5px;  margin-bottom:5px; color: white;"
				styleClass="ui-confirmdialog-yes  btn btn-primary "
				icon="ui-icon-check">
				<f:ajax render=":messageScript"></f:ajax>
				<em class="fa fa-check" />
			</h:commandLink>
			<h:commandLink value='#{bundle.no}'
				style="color:white; margin-left:5px; margin-top:5px; margin-bottom:5px;"
				styleClass="ui-confirmdialog-no btn btn-danger">
				<em class="fa fa-times" />
				<f:ajax></f:ajax>
			</h:commandLink>
		</p:confirmDialog>

	</ui:define>
</ui:composition>

</html>
