<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:f5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.worker_list}' />
	<ui:param name="subtitle" value='#{bundle.worker_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>
	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.cards}</li>
		<li class="breadcrumb-item active">#{bundle.worker}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">
		<o:importConstants type="enums.PersonGenre" var="personGenre" />

		<div class="card">
			<div class="card-body">
				<div class="row">
					<h:panelGroup id="conter-top" class="col-md-4 col-sm-6">
						<span class="sf-list-title">
							#{bundle.worker_list} :</span>


						<div class="avatar-box thumb-sm align-self-center mr-2">
							<span id="countId" class="avatar-title rounded-circle">#{workerListController.countItems()}</span>
						</div>


					</h:panelGroup>
					<h:panelGroup id="save-form" class="col-md-8 col-sm-6 ">
						<h:commandLink action='worker-card' id="btn-to-crud"
							styleClass="btn btn-primary waves-effect waves-light btn-crud-page"
							style="float:left;margin-left:5px;">
							<i class="fa fa-plus"></i>
							<span>#{bundle.new_worker}</span>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-to-crud"
							atPosition="right center" value="#{bundle.ctrl_x}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>

				<h:panelGroup id="tablePanelId">
					<div class="row" style="margin-left: 8px; margin-top: 10px;">
						<p:dataTable
							currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
							emptyMessage="#{bundle.no_records}"
							filteredValue="#{workerListController.filteredList}" id="tableId"
							paginator="true" paginatorPosition="bottom"
							paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
							rowKey="#{item.id}" rows="10"
							rowsPerPageTemplate="10,20,30,#{workerListController.pageItems.size()}"
							styleClass="table table-striped table-hover"
							value="#{workerListController.pageItems}" var="item"
							widgetVar="pageItemsTableWgVar">
							<p:ajax event="rowToggle"
								listener="#{workerListController.select(item)}" />
							<p:column styleClass="toggler" id="relatedFileToggler" width="30"
								exportable="false">
								<p:rowToggler />
							</p:column>
							<p:ajax event="rowEdit" update=":messageScript" />
							<p:column styleClass="no-header table-actions-column" width="80">
								<span><p:commandLink title="#{bundle.delete}" update=":messageScript"
										actionListener="#{workerListController.delete(item)}"
										style="margin-left:5px;"
										styleClass="btn btn-danger waves-effect waves-light btn-xs ">
										<i class=" dripicons-trash  "
											style="color: white; font-size: 11px;" />
										<p:confirm header="#{bundle.delete}" 
											message="#{bundle.are_you_sure_from_delete}">
										</p:confirm>
										<p:ajax oncomplete="PF('pageItemsTableWgVar').filter()"
											update="  :messageScript conter-top">
										</p:ajax>
									</p:commandLink> <h:link title="#{bundle.edit}" outcome="worker-card"
										styleClass="btn btn-warning  waves-effect waves-light   btn-xs">
										<f:param name="id" value="#{item.id}" />
										<span class=" dripicons-document-edit  " style="color: white;" />
										<f:ajax></f:ajax>
									</h:link> </span>
							</p:column>


							<p:column filterBy="#{item.name}" filterMatchMode="contains"
								headerText="#{bundle.worker_name}" sortBy="#{item.name}"
								width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.worker_name}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="fullName" styleClass="text-ellipsis"
									title="#{item.name}" value="#{item.name}" />
							</p:column>

							<p:column filterBy="#{item.phoneNo}"
								headerText="#{bundle.worker_phone_no}" sortBy="#{item.phoneNo}"
								width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.worker_phone_no}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="phoneNo" styleClass="text-ellipsis"
									title="#{item.phoneNo}" value="#{item.phoneNo}" />
							</p:column>

							<p:column filterBy="#{item.livingArea}"
								headerText="#{bundle.worker_living_area}"
								sortBy="#{item.livingArea}" width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.worker_living_area}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="livingArea" styleClass="text-ellipsis"
									title="#{item.livingArea}" value="#{item.livingArea}" />
							</p:column>

							<p:column filterBy="#{bundle.worker_religion}"
								filterMatchMode="startsWith"
								headerText="#{bundle.worker_religion}"
								sortBy="#{item.religion.name}" width="180">
								<f:facet name="filter">
									<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
										style="width:100% ;   " styleClass="inputtext-filter">
										<f:selectItem itemLabel="#{bundle.worker_religion }"
											itemValue="#{null}" noSelectionOption="true" />
										<f:selectItems value="#{workerListController.religionList}"
											var="religion" itemLabel="#{religion.name}"
											itemValue="#{religion.name}" />
										<f:ajax></f:ajax>
									</p:selectOneMenu>
								</f:facet>
								<h:outputText value="#{item.religion.name}"
									styleClass="text-ellipsis" title="#{item.religion.name}"></h:outputText>
							</p:column>

							<p:column filterBy="#{item.notes}"
								headerText=" #{bundle.worker_notes}" sortBy="#{item.notes}"
								width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.worker_notes}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="notesId" styleClass="text-ellipsis"
									title="#{item.notes}" value="#{item.notes}" />
							</p:column>

							<p:rowExpansion>
								<div class="card">
									<div class="card-body">
										<div class="row">
											<ul class="nav nav-pills mb-3 nav-justified" id="pills-tab"
												role="tablist">
												<li class="nav-item"><a class="nav-link active"
													id="general_chat_tab" data-toggle="pill"
													href="#general_chat">#{bundle.services}</a></li>
											</ul>
										</div>
										<div class="tab-pane fade active show" id="general_chat">

											<div class="row">
												<ui:repeat var="sr" value="#{item.services}"
													varStatus="status">

													<h:outputText style="min-width: 80px;margin-right:7px;"
														styleClass="btn btn-primary" value="#{sr.name}"
														title="#{sr.name}" />

												</ui:repeat>
											</div>
										</div>
									</div>
								</div>
							</p:rowExpansion>
						</p:dataTable>
					</div>
				</h:panelGroup>
			</div>
		</div>
		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<h:commandLink value='#{bundle.yes}'
				style="margin-left:10px  ; margin-top:5px;  margin-bottom:5px; color: white;"
				styleClass="ui-confirmdialog-yes  btn btn-primary "
				icon="ui-icon-check">
				<f:ajax  render=":messageScript"></f:ajax>
				<em class="fa fa-check" />
			</h:commandLink>
			<h:commandLink value='#{bundle.no}'
				style="color:white; margin-left:5px; margin-top:5px; margin-bottom:5px;"
				styleClass="ui-confirmdialog-no btn btn-danger">
				<em class="fa fa-times" />
				<f:ajax></f:ajax>
			</h:commandLink>
		</p:confirmDialog>

	</ui:define>
</ui:composition>

</html>
