<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:h5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:h="http://java.sun.com/jsf/html">

<h:head></h:head>
<body>
	<ui:composition template="/views/template/template.xhtml">

		<ui:define name="breadcrumb">
			<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
			<li class="breadcrumb-item active">#{bundle.reports}</li>


			<li class="breadcrumb-item active">#{bundle.general_repport }</li>

			<!--end col-->
		</ui:define>

		<ui:define name="customStyleSheet">


			<h:outputStylesheet name="toggle/bootstrap-toggle.min.css"
				library="plugins" />
		</ui:define>
		<ui:define name="customFormContent">
			<o:onloadScript>
	select2me();
     initDatePicker();
       </o:onloadScript>



			<div class="sf-title">

				<span class="fas fa-chart-line sf-title__icon" aria-hidden="true"></span>

				<h:outputText styleClass="sf-title__text"
					value=" #{bundle.general_repport}" />


			</div>

			<h:panelGroup id="value-panel">
				<div class="row">
					<div class="col-lg-6">
						<div class="card">
							<div class="card-body">
								<div class="icon-contain">
									<div class="row">
										<div class="col-9 align-self-center">
											<h5 style="margin-bottom: 20px;">#{bundle.total_cost_ll}</h5>

											<h:outputText styleClass="mb-0 p-2 sf-amount sf-amount--lbp rounded"
												style="font-size: 16px;font-weight: bold; margin-top:5px; "
												value= "  #{of:formatCurrencyForLocale(externalRepportController.totalValueLL, '', 'en-US')} LBP"  
												>
												
												
												
												</h:outputText>



										</div>


										<!--end col-->

										<!--end col-->
									</div>
									<!--end row-->
								</div>
								<!--end icon-contain-->
							</div>
							<!--end card-body-->
						</div>
						<!--end card-->
					</div>




					<div class="col-lg-6">
						<div class="card">
							<div class="card-body">
								<div class="icon-contain">
									<div class="row">
										<div class="col-9 align-self-center">
											<h5 style="margin-bottom: 20px;">#{bundle.total_cost_dd}</h5>

											<h:outputText styleClass="mb-0 p-2 sf-amount sf-amount--usd rounded"
												style="font-size: 16px;font-weight: bold; margin-top:5px; "
												value="  #{of:formatCurrencyForLocale(externalRepportController.totalValueDD, '', 'en-US')} USD"></h:outputText>



										</div>


										<!--end col-->

										<!--end col-->
									</div>
									<!--end row-->
								</div>
								<!--end icon-contain-->
							</div>
							<!--end card-body-->
						</div>
						<!--end card-->
					</div>
					<!--end col-->
				</div>


			</h:panelGroup>


			<div class="card">
				<div class="card-body">
					<span
						style="font-size: 16px; margin-top: 10px; margin-bottom: 10px;"><p:spacer
							width="5" /> #{bundle.gives_details} :</span>


					<p:dataTable
						currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
						emptyMessage="#{bundle.no_records}" style="margin-top:12px;"
						filteredValue="#{externalRepportController.allSubmissionDetailsCfgListFilterd}"
						id="tableId" paginator="true" paginatorPosition="bottom"
						paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
						rowKey="#{item.id}" rows="10"
						rowsPerPageTemplate="10,20,30,#{externalRepportController.allSubmissionDetailsCfgList.size()}"
						styleClass="table table-striped table-hover"
						value="#{externalRepportController.allSubmissionDetailsCfgList}"
						var="item" widgetVar="pageItemsTableWgVar">
						<p:ajax event="rowEdit" update=":messageScript" />


						<p:column styleClass="no-header table-actions-column" width="80">
							<span> <h:link title="فتح" outcome="repport-deatils"
									styleClass="btn  btn-success waves-effect waves-light   btn-xs">
									<f:param name="id" value="#{item.id}" />
									<span class="   mdi mdi-chevron-right-circle  "
										style="font-size: 16px; color: white;" />
									<f:ajax></f:ajax>
								</h:link>
							</span>
						</p:column>
						<p:column filterBy="#{item.type}" filterMatchMode="startsWith"
							headerText="#{bundle.receive_money_submissionDetailsCfg}:"
							sortBy="#{item.type}" width="180">
							<f:facet name="filter">
								<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
									style="width:100% ;   " styleClass="inputtext-filter">
									<f:selectItem
										itemLabel="#{bundle.receive_money_submissionDetailsCfg}"
										itemValue="#{null}" noSelectionOption="true" />


									<f:selectItems
										value="#{companayRepportContoller.listSubmissionDetailsCfg}"
										var="re" itemLabel="#{re.type}" itemValue="#{re}" />
									<f:ajax></f:ajax>
								</p:selectOneMenu>
							</f:facet>
							<h:outputText value="#{item.type}" styleClass="text-ellipsis"
								title="#{item.type}"></h:outputText>
						</p:column>




						<p:column headerText="#{bundle.submission_details_cfg_ll}"
							sortBy="#{item.balance_ll}" width="150">

							<h:outputText styleClass="text-ellipsis"
								title="#{item.balance_ll}" 
							value = 	" #{of:formatCurrencyForLocale(item.balance_ll, '', 'en-US')}  "	
								
								 />




						</p:column>


						<p:column headerText="#{bundle.submission_details_cfg_dollar}"
							sortBy="#{item.balance_dd}" width="150">

							<h:outputText styleClass="text-ellipsis"
							
						 value= " #{of:formatCurrencyForLocale(item.balance_dd, '', 'en-US')}  "	
							
								title="#{item.balance_dd}" />




						</p:column>







					</p:dataTable>

				</div>


			</div>
		</ui:define>
	</ui:composition>
</body>
</html>
