<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:h5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:h="http://java.sun.com/jsf/html">

<h:head>


</h:head>
<body>
	<ui:composition template="/views/template/template.xhtml">


		<ui:define name="breadcrumb">


			<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
			<li class="breadcrumb-item active">#{bundle.services}</li>

			<li class="breadcrumb-item active">#{bundle.add_purchase_voucher}</li>

			<!--end col-->
		</ui:define>


		<ui:define name="customStyleSheet">


			<h:outputStylesheet name="toggle/bootstrap-toggle.min.css"
				library="plugins" />
		</ui:define>
		<ui:define name="customFormContent">
			<o:onloadScript>
	select2me();
	($('.toogle')).bootstrapToggle();
     initDatePicker();
     inputNumberPicker();
     disabelButton(#{purchaseVoucherCardController.purchaseVoucher.paied});
       </o:onloadScript>


			<div class="col-md-12" style="margin-top: 2%;">

				<span class="   fas fa-shopping-cart   " style="font-size: 28px;"></span>

				<h:outputText style="font-size: 22px;"
					value=" #{bundle.service_purchase_voucher}" />


			</div>

			<o:massAttribute name="disabled"
				value="#{purchaseVoucherCardController.purchaseVoucher.paied}">

				<h:panelGroup id="store-select-panel">




					<div class="card" style="margin-top: 2%;">
						<div class="card-body">




							<p:outputLabel style="margin-right:2%;font-size:16px;"
								for="storeId" value="#{bundle.select_store}">
							</p:outputLabel>

							<div class="row">

								<div class="col-md-5"
									style="margin-top: 1%; float: right; margin-right: 1%;">




									<h:selectOneMenu style="width: 100% ; "
										styleClass="select2 select2me form-control   custom-select"
										immediate="true" converter="omnifaces.SelectItemsConverter"
										id="storeId" label="#{bundle.stores_name}" required="true"
										value="#{purchaseVoucherCardController.purchaseVoucher.stores}">
										<f:selectItem itemLabel="لا يوجد" itemValue="" />
										<f:selectItems
											value="#{purchaseVoucherCardController.storeList}" var="re"
											itemLabel="#{re.storeName}  " itemValue="#{re}" />
										<f:ajax></f:ajax>
									</h:selectOneMenu>

									<h:message styleClass="error-message" for="storeId" />

								</div>







							</div>
						</div>

					</div>
				</h:panelGroup>

				<h:panelGroup id="add-new-voucher-item" class="col-md-6">
					<h:commandLink value='#{bundle.purchase_details_new}' id="btn-save"
						style="float:left;margin-left:10px;"
						styleClass="btn btn-primary waves-effect waves-light btn-new"
						action='#{purchaseVoucherCardController.addNewPurchaseVoucherCoupon()}'>
						<f:ajax render=" :messageScript  form-purchase-voucher-coupon " />
						<span class="fa fa-plus"></span>
					</h:commandLink>

					<p:tooltip id="toolTipGrow" for="btn-save"
						atPosition="right center" value="#{bundle.ctrl_z}"
						showEffect="slide" hideEffect="slide" position="right" />
				</h:panelGroup>


				<h:panelGroup id="form-purchase-voucher-coupon"
					style="width:100% ; display: inline-block ; ">
					<div class="row" style="margin-top: 1%;">

						<ui:repeat var="var" varStatus="myVarStatus" style="width:100%"
							value="#{purchaseVoucherCardController.purchaseVoucher.listPurchaseVoucherCoupon}">

							<div class="col-md-6">

								<div class="card " style="margin-top: 1%;">
									<div class="card-body">
										<div class="row">
											<div class="repeater-custom-show-hide" style="width: 100%">
												<div class="row">
													<div class="col-md-6">
														<h:outputText
															style="font-size: 16px; padding : 2% ; background-color: #967adc; "
															styleClass="badge badge-success"
															value=" #{bundle.give_number} : #{myVarStatus.index +1 }" />
													</div>
													<div class="col-md-6">
														<h:commandLink value='#{bundle.remove}'
															rendered="#{!purchaseVoucherCardController.purchaseVoucher.paied}"
															style=" float:left;"
															action='#{purchaseVoucherCardController.removePurchaseVoucherCoupon(var)}'
															styleClass="btn btn-danger waves-effect waves-light ">
															<f:ajax
																render=" :messageScript  form-purchase-voucher-coupon " />
															<span class="fa fa-trash"></span>
														</h:commandLink>
													</div>
												</div>

												<h:panelGroup id="total_ui_repeat_value"
													style="width:100% !important">

													<div class="col-md-12">

														<h:outputText
															styleClass="mb-0 p-2 bg-soft-success  rounded"
															style="font-size: 16px;font-weight: bold; margin-top:5px; line-height:4"
															value=" #{bundle.total_value_exist_init  }  : #{of:formatCurrency(var.submissionDetailsCfg.balance_ll, '')}  LBP "></h:outputText>

													</div>
													<div class="col-md-12">
														<h:outputText styleClass="mb-0 p-2 bg-soft-blue  rounded"
															style="font-size: 16px;font-weight: bold; margin-top:5px; line-height:4 "
															value="  #{bundle.total_value_reset }   :     #{of:formatCurrency(var.submissionDetailsCfg.balance_ll - (var.value * purchaseVoucherCardController.selectedListDeserved.size()) , '')}     LBP
"></h:outputText>
													</div>






													<div class="col-md-12">
														<h:outputText styleClass="mb-0 p-2 bg-soft-dark rounded"
															style="font-size: 16px ; margin-top:5px; line-height:4 "
															value="  #{bundle.total_give_from_aid}   :   #{purchaseVoucherCardController.selectedListDeserved eq null ?  ( of:formatNumber (var.value * purchaseVoucherCardController.orginalListFromDBGiven.size() , '')) :  (  purchaseVoucherCardController.orginalListFromDBGiven != null ?    of:formatCurrency( var.value * ( purchaseVoucherCardController.selectedListDeserved.size() +  purchaseVoucherCardController.orginalListFromDBGiven.size() ),'')  :  of:formatCurrency(var.value * purchaseVoucherCardController.selectedListDeserved.size() ,'' ) ) } LBP"></h:outputText>
													</div>




												</h:panelGroup>
												<div class="row" style="margin-top: 3%;">
													<div class="col-md-6">
														<p:outputLabel class="control-label"
															for="submissionDetailsCfgId"
															value="#{bundle.receive_money_submissionDetailsCfg}:" />
														<h:selectOneMenu style="width: 100% ;  margin-top:5px"
															styleClass="select2 select2me form-control   custom-select"
															immediate="true"
															rendered="#{ !purchaseVoucherCardController.listUsedSubbmissionUsed.contains(var.submissionDetailsCfg)}"
															converter="omnifaces.SelectItemsConverter"
															id="submissionDetailsCfgId" required="true"
															label="#{bundle.receive_money_submissionDetailsCfg}:"
															placeHolder="#{bundle.receive_money_submissionDetailsCfg}:"
															value="#{var.submissionDetailsCfg}">
															<f:selectItem itemLabel="لا يوجد" itemValue="" />
															<f:selectItems
																value="#{purchaseVoucherCardController.listSubmissionDetailsCfg}"
																var="re" itemLabel="#{re.type}" itemValue="#{re}" />
															<f:ajax render="total_ui_repeat_value"></f:ajax>
														</h:selectOneMenu>


														<h:outputText
															rendered="#{purchaseVoucherCardController.orginalListFromDBGiven.size()>0 and  purchaseVoucherCardController.listUsedSubbmissionUsed.contains(var.submissionDetailsCfg)}"
															styleClass="form-control"
															value="#{var.submissionDetailsCfg.type}" />

														<h:message for="submissionDetailsCfgId"
															styleClass="error-message" />
													</div>
													<div class="col-md-6">
														<div class="form-group">
															<p:outputLabel class="control-label" for="x"
																value="#{bundle.receive_money_value}:" />
															<p:inputNumber id="x" required="true"
																disabled="#{purchaseVoucherCardController.orginalListFromDBGiven.size()>0 and  purchaseVoucherCardController.listUsedSubbmissionUsed.contains(var.submissionDetailsCfg)}"
																label="#{bundle.receive_money_value}:" decimalPlaces="0"
																inputStyleClass="form-control "
																value="#{var.value}">
																<f:ajax event="blur" render="total_ui_repeat_value">

																</f:ajax>
															</p:inputNumber>
															<h:message styleClass="error-message" for="x" />

														</div>
													</div>

												</div>

											</div>


										</div>
									</div>
								</div>
							</div>
						</ui:repeat>
					</div>
				</h:panelGroup>
				<!-- select Desrved List -->
				<div class="col-md-12" style="margin-top: 2%;">

					<span class=" fas fa-filter " style="font-size: 25px;"></span>

					<h:outputText style="font-size: 22px;"
						value=" #{bundle.select_deserved}" />


				</div>



				<div class="card" style="margin-top: 1%;">
					<div class="card-body">
						<h:panelGroup style="width:100%" id="filter-panel">


							<div class="row">
								<div class="col-md-3">
									<div class="form-group">
										<label for="healthyId">#{bundle.deserved_healthy_status}</label>
										<h:selectOneMenu id="healthyId"
											converter="omnifaces.SelectItemsConverter"
											style="width: 100%;" label="#{bundle.select_healthy_status}"
											styleClass="select2 select2me form-control custom-select"
											value="#{purchaseVoucherCardController.healthyStatusCfg}">
											<f:selectItem itemLabel="لا يوجد" itemValue="" />
											<f:selectItems
												value="#{purchaseVoucherCardController.healthyStatusList}"
												var="healthy" itemLabel="#{healthy.status}"
												itemValue="#{healthy}" />
											<f:ajax></f:ajax>
										</h:selectOneMenu>
										<h:message for="healthyId" styleClass="error-message" />
									</div>
								</div>



								<div class="col-md-3">
									<label for="religionId">#{bundle.deserved_religion_reference}</label>
									<h:selectOneMenu style="width: 100%;"
										styleClass="select2  select2me form-control  custom-select"
										converter="omnifaces.SelectItemsConverter" id="religionId"
										label="#{bundle.deserved_religion_reference}"
										placeHolder="#{bundle.deserved_religion_reference}"
										value="#{purchaseVoucherCardController.religionReferenceCfg}">
										<f:selectItem itemLabel="لا يوجد" itemValue="" />
										<f:selectItems
											value="#{purchaseVoucherCardController.religionReferenceCfgList}"
											var="re" itemLabel="#{re.name}" itemValue="#{re}" />
										<f:ajax></f:ajax>
									</h:selectOneMenu>
									<h:message for="religionId" styleClass="error-message" />

								</div>



								<div class="col-md-3">
									<label for="InssuranceId">#{bundle.deserved_inssurance}</label>
									<h:selectOneMenu style="width: 100%;"
										styleClass="select2  select2me form-control  custom-select"
										converter="omnifaces.SelectItemsConverter" id="InssuranceId"
										label="#{bundle.deserved_religion_reference}"
										placeHolder="#{bundle.deserved_religion_reference}"
										value="#{purchaseVoucherCardController.inssuranceCfg}">
										<f:selectItem itemLabel="لا يوجد" itemValue="" />
										<f:selectItems
											value="#{purchaseVoucherCardController.inssuranceCfgList}"
											var="in" itemLabel="#{in.name}" itemValue="#{in}" />
										<f:ajax></f:ajax>
									</h:selectOneMenu>
									<h:message for="InssuranceId" styleClass="error-message" />
								</div>

								<div class="col-md-3">
									<label for="poorId">#{bundle.deserved_poor_percentage}</label>
									<h:selectOneMenu style="width: 100%;"
										styleClass="select2  select2me form-control  custom-select"
										converter="omnifaces.SelectItemsConverter" id="poorId"
										label="#{bundle.deserved_poor_percentage}"
										placeHolder="#{bundle.deserved_religion_reference}"
										value="#{purchaseVoucherCardController.poorPercenatageCfg}">
										<f:selectItem itemLabel="لا يوجد" itemValue="" />
										<f:selectItems
											value="#{purchaseVoucherCardController.poorPercentageCfgList}"
											var="poor" itemLabel="#{poor.description}"
											itemValue="#{poor}" />
										<f:ajax></f:ajax>
									</h:selectOneMenu>
									<h:message for="poorId" styleClass="error-message" />
								</div>

							</div>

							<div class="row">


								<div class="col-md-3">
									<div class="form-group-sm">
										<p:outputLabel class="control-label" for="nb_child_from"
											value="#{bundle.nb_child_from}:" />
										<h:inputText id="nb_child_from"
											label="#{bundle.nb_child_from}" h5:step="1" type="number"
											h5:min="0" h5:max="100"
											styleClass="form-control-sm input-number-picker"
											value="#{purchaseVoucherCardController.nbChildFrom}" />

										<h:message styleClass="error-message" for="nb_child_from" />

									</div>
								</div>



								<div class="col-md-3">
									<div class="form-group-sm">
										<p:outputLabel class="control-label" for="nb_child_to"
											value="#{bundle.nb_child_to}:" />

										<h:inputText id="nb_child_to" label="#{bundle.nb_child_to}"
											h5:step="1" h5:min="0" h5:max="100"
											styleClass="form-control-sm input-number-picker"
											value="#{purchaseVoucherCardController.nbChildTo}">

										</h:inputText>
										<h:message styleClass="error-message" for="nb_child_to" />

									</div>
								</div>



								<div class="col-md-3">
									<div class="form-group-sm">
										<p:outputLabel class="control-label" for="livingAreaId"
											value="#{bundle.deserved_living_are}:" />
										<h:inputText id="livingAreaId"
											label="#{bundle.deserved_living_are}"
											styleClass="form-control"
											value="#{purchaseVoucherCardController.livingArea}" />

										<h:message styleClass="error-message" for="livingAreaId" />

									</div>
								</div>

								<div class="col-md-1">



									<p:outputLabel class="control-label" for="nb_child_to"
										value="#{bundle.deserved_has_car}" />
									<div class="skin">
										<h:selectBooleanCheckbox id="booelanSelectDate"
											label="#{bundle.deserved_has_car}" styleClass="toogle"
											h5:data-width="100%" h5:data-offstyle="danger"
											onchange="showHideToogle();" data-style="slow"
											h5:data-toggle="toogle" h5:data-off="#{bundle.no}"
											h5:data-on="#{bundle.yes}" h5:data-onstyle="info"
											value="#{purchaseVoucherCardController.hasCar}">

											<f:ajax onevent="showHideToogle();" event="change"></f:ajax>
										</h:selectBooleanCheckbox>

									</div>
								</div>



								<div class="col-md-1">



									<p:outputLabel class="control-label" for="richLogical"
										value="#{bundle.deserved_rich_logical}" />
									<div class="skin">
										<h:selectBooleanCheckbox id="richLogical"
											label="#{bundle.deserved_rich_logical}" styleClass="toogle"
											h5:data-width="100%" h5:data-offstyle="danger"
											onchange="showHideToogle();" data-style="slow"
											h5:data-toggle="toogle" h5:data-off="#{bundle.no}"
											h5:data-on="#{bundle.yes}" h5:data-onstyle="info"
											value="#{purchaseVoucherCardController.richLogical}">

											<f:ajax onevent="showHideToogle();" event="change"></f:ajax>
										</h:selectBooleanCheckbox>

									</div>
								</div>
							</div>



							<div class="row" style="margin-top: 1.5%">
								<div class="col-md-12">
									<h:commandLink value='#{bundle.search}' id="btn-search"
										style="float:left;"
										action='#{purchaseVoucherCardController.findDesrved}'
										styleClass="btn btn-warning  waves-effect waves-light btn-new">
										<f:ajax execute="filter-panel"
											render=" :messageScript table-result" />
										<span class="fas fa-search"></span>
									</h:commandLink>

								</div>
							</div>


						</h:panelGroup>

					</div>

				</div>



				<div class="col-md-12" style="margin-top: 2%;">

					<span class="  mdi mdi-table-plus  " style="font-size: 25px;"></span>

					<h:outputText style="font-size: 22px;"
						value=" #{bundle.table_select}" />


				</div>
				<h:panelGroup id="table-result">
					<div class="card " style="margin-top: 2%;">
						<div class="card-body">


							<p:dataTable
								currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
								style="margin-top: 2%; display: block ;"
								emptyMessage="#{bundle.no_records}"
								filteredValue="#{purchaseVoucherCardController.desrvedListFilter}"
								id="tableId" paginator="true" paginatorPosition="bottom"
								selection="#{purchaseVoucherCardController.selectedListDeserved}"
								paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
								rowKey="#{item.id}" rows="10" scrollable="true"
								rowsPerPageTemplate="10,20,30,#{purchaseVoucherCardController.desrvedList.size()}"
								styleClass="table  manycolumn table-striped table-hover  table-responsive"
								value="#{purchaseVoucherCardController.desrvedList}" var="item"
								widgetVar="pageItemsTableWgVar">

								<p:ajax event="rowSelectCheckbox"
									update="form-purchase-voucher-coupon" />
								<p:ajax event="rowUnselectCheckbox"
									update="form-purchase-voucher-coupon" />
								<p:ajax event="rowSelect" update="form-purchase-voucher-coupon" />
								<p:ajax event="rowUnselect"
									update="form-purchase-voucher-coupon" />
								<p:ajax event="rowEdit" update=":messageScript" />
								<p:column width="30px;" selectionMode="multiple"
									style="width:50px;text-align:center">

								</p:column>


								<p:column filterBy="#{item.fullName}" filterMatchMode="contains"
									headerText="#{bundle.deserved_full_name}"
									sortBy="#{item.fullName}" width="150">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_full_name}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText id="fullNameId" styleClass="text-ellipsis"
										title="#{item.fullName}" value="#{item.fullName}" />
								</p:column>

								<p:column filterBy="#{item.nbOfIndividuals}"
									headerText="#{bundle.deserved_nb_of_individuals}"
									filterMatchMode="startsWith" sortBy="#{item.nbOfIndividuals}"
									width="180">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_nb_of_individuals}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText value="#{item.nbOfIndividuals}"
										styleClass="text-ellipsis" title="#{item.nbOfIndividuals}"></h:outputText>
								</p:column>


								<p:column filterBy="#{item.nbOfExpatiateChildren}"
									headerText="#{bundle.deserved_nb_of_expatiate_children}"
									filterMatchMode="startsWith" sortBy="#{item.nbOfIndividuals}"
									width="180">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_nb_of_expatiate_children}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText value="#{item.nbOfExpatiateChildren}"
										styleClass="text-ellipsis"
										title="#{item.nbOfExpatiateChildren}"></h:outputText>
								</p:column>

								<p:column filterBy="#{item.livingArea}"
									headerText="#{bundle.deserved_living_are}"
									filterMatchMode="startsWith" sortBy="#{item.livingArea}"
									width="180">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_living_are}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText value="#{item.livingArea}"
										styleClass="text-ellipsis" title="#{item.livingArea}"></h:outputText>
								</p:column>


								<p:column filterBy="#{item.knownBy}"
									headerText="#{bundle.deserved_known_by}"
									filterMatchMode="startsWith" sortBy="#{item.knownBy}"
									width="180">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_known_by}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText value="#{item.knownBy}"
										styleClass="text-ellipsis" title="#{item.knownBy}"></h:outputText>
								</p:column>


								<p:column filterBy="#{item.salary}" filterMatchMode="startsWith"
									sortBy="#{item.salary}" headerText="#{bundle.deserved_salary}"
									width="180">
									<f:facet name="filter">
										<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
											placeholder="#{bundle.deserved_salary}"
											styleClass="inputtext-filter" />
									</f:facet>
									<h:outputText value="#{item.salary}" styleClass="text-ellipsis"
										title="#{item.salary}"></h:outputText>
								</p:column>



								<p:column filterBy="#{item.working}" filterMatchMode="exact"
									headerText="#{bundle.deserved_working}"
									sortBy="#{item.working}" width="180">
									<f:facet name="filter">
										<p:selectOneMenu onchange="PF('pageItemsTableWgVar').filter()"
											converter="javax.faces.Boolean" style="width:100% ;   "
											styleClass="inputtext-filter">
											<f:selectItem itemLabel="الجميع" itemValue="#{null}"
												noSelectionOption="true" />
											<f:selectItem itemLabel="#{bundle.no}" itemValue="false" />
											<f:selectItem itemLabel="#{bundle.yes}" itemValue="true" />
											<f:ajax></f:ajax>
										</p:selectOneMenu>
									</f:facet>
									<h:outputText
										styleClass="#{item.working ? 'fa fa-check' : 'fa fa-times'}"
