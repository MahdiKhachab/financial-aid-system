<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:h5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:h="http://java.sun.com/jsf/html">

<h:head></h:head>
<body>
	<ui:composition template="/views/template/template.xhtml">

		<ui:define name="breadcrumb">

			<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
			<li class="breadcrumb-item active">#{bundle.cards}</li>
			<li class="breadcrumb-item active"><h:link
					outcome="sponsor-list"> #{bundle.sponsor} </h:link></li>
			<!--end col-->
		</ui:define>


		<ui:define name="customFormContent">
			<o:onloadScript>
	select2me();
     
       </o:onloadScript>



			<div class="col-md-12">

				<span class=" mdi mdi-account-plus " style="font-size: 28px;"></span>

				<h:outputText style="font-size: 22px;"
					value=" #{bundle.add_sponsor}" />


			</div>
			<div class="card" style="margin-top: 10px;">

				<div class="card-body">

					<h:panelGroup id="form-save">

						<div class="row" style="margin-top: 2%;">
							<div class="col-md-6">
								<div class="form-group">
									<p:outputLabel class="control-label" for="sponsor_fullName"
										value="#{bundle.sponsor_fullName}:" />
									<h:inputText id="sponsor_fullName" required="true"
										label="#{bundle.sponsor_fullName}:" styleClass="form-control"
										value="#{sponsorCardController.sponsor.fullName}" />
									<h:message styleClass="error-message" for="sponsor_fullName" />

								</div>
							</div>


							<div class="col-md-6">
								<div class="form-group">
									<p:outputLabel class="control-label" for="sponsor_tel"
										value="#{bundle.sponsor_phoneNo}:" />
									<h:inputText id="sponsor_tel"
										onkeypress="return isNumberKey(event)"
										label="#{bundle.sponsor_phoneNo}:" styleClass="form-control"
										value="#{sponsorCardController.sponsor.phoneNo}" />

									<h:message styleClass="error-message" for="sponsor_tel" />

								</div>
							</div>
						</div>

						<div class="row">
							<div class="col-md-6">




								<p:outputLabel class="control-label" for="religionId"
									value="#{bundle.sponsor_religionReferenceCfg}:" />




								<h:selectOneMenu style="width: 100% ;  margin-top:5px"
									styleClass="select2 select2me form-control   custom-select"
									immediate="true" converter="omnifaces.SelectItemsConverter"
									id="religionId" label="#{bundle.deserved_religion_reference}"
									placeHolder="#{bundle.sponsor_religionReferenceCfg}"
									value="#{sponsorCardController.sponsor.religionReferenceCfg}">
									<f:selectItem itemLabel="لا يوجد" itemValue="" />
									<f:selectItems
										value="#{sponsorCardController.religionReferenceCfgList}"
										var="re" itemLabel="#{re.name}" itemValue="#{re}" />
									<f:ajax></f:ajax>
								</h:selectOneMenu>



								<h:message for="religionId" styleClass="error-message" />
							</div>

							<div class="col-md-6">
								<div class="form-group">
									<p:outputLabel class="control-label" for="sponsor_living_area"
										value="#{bundle.sponsor_livingArea}:" />
									<h:inputText id="sponsor_living_area"
										label="#{bundle.sponsor_livingArea}:"
										styleClass="form-control"
										value="#{sponsorCardController.sponsor.livingArea}" />

									<h:message styleClass="error-message" for="sponsor_living_area" />

								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-md-12">
								<div class="float-right">
									<h:commandLink action="sponsor-list" id="cancelButton"
										style="margin-left:6px;"
										styleClass="btn btn-danger btn-cancel">
										<span>#{bundle.back}</span>
										<i class="fas fa-caret-square-left"></i>

										<f:ajax></f:ajax>
									</h:commandLink>
									<p:tooltip id="toolTipGrow" for="cancelButton"
										atPosition="right center" value="#{bundle.ctrl_d}"
										hideEvent="mouseleave click" showEffect="slide"
										hideEffect="slide" position="right" />
									<h:commandLink value='#{bundle.save}' id="save_btn"
										action='#{sponsorCardController.save()}'
										styleClass="btn btn-primary btn-save">
										<f:ajax render=":messageScript :formTemplate"
											execute="form-save" />
										<i class="fa fa-save" />
										<p:tooltip id="toolTipGrow2" for="save_btn"
											hideEvent="mouseleave click" atPosition="right center"
											value="#{bundle.ctrl_s}" styleClass="btn-cancel"
											showEffect="slide" hideEffect="slide" position="right" />



									</h:commandLink>

								</div>
							</div>
						</div>
					</h:panelGroup>
				</div>
			</div>
		</ui:define>



	</ui:composition>


</body>
</html>
