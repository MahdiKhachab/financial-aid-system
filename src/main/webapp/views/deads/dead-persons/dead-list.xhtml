<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:f5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.deserved_list}' />
	<ui:param name="subtitle" value='#{bundle.deserved_list}' />

	<ui:define name="customStyleSheet">
		<h:outputStylesheet name="template/general.css" library="css" />
	</ui:define>
	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.configurations}</li>
		<li class="breadcrumb-item active">#{bundle.dead_person}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">
		<o:importConstants type="enums.NeedTypeEnum" var="needType" />

		<div class="card" style="margin-top: 10px;">
			<div class="card-body">
				<div class="row">
					<h:panelGroup id="conter-top" class="col-md-4 col-sm-6">
						<span style="font-size: 16px;"><p:spacer width="5" />
							#{bundle.dead_person} :</span>

						<div class="avatar-box thumb-sm align-self-center mr-2">
							<span id="countId" class="avatar-title rounded-circle"
								style="color: white !important; background-color: #0069d9 !important;">#{deadPersonController.countItems()}</span>
						</div>

					</h:panelGroup>
					<h:panelGroup id="save-form" class="col-md-8 col-sm-6 ">
						<h:commandLink action='dead-card' id="btn-to-crud"
							styleClass="btn btn-primary waves-effect waves-light btn-crud-page"
							style="float:left;margin-left:5px;">
							<i class="fa fa-plus"></i>
							<span>#{bundle.new_dead_person}</span>
						</h:commandLink>
						<p:tooltip id="toolTipGrow" for="btn-to-crud"
							atPosition="right center" value="#{bundle.ctrl_x}"
							showEffect="slide" hideEffect="slide" position="right" />
					</h:panelGroup>
				</div>

				<h:panelGroup id="tablePanelId">
					<div class="row" style="margin-left: 8px; margin-top: 10px;">
						<p:dataTable
							currentPageReportTemplate="#{bundle.row_count}: {totalRecords}"
							emptyMessage="#{bundle.no_records}"
							filteredValue="#{deadPersonController.filteredList}" id="tableId"
							paginator="true" paginatorPosition="bottom"
							paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}"
							rowKey="#{item.id}" rows="10"
							rowsPerPageTemplate="10,20,30,#{deadPersonController.pageItems.size()}"
							styleClass="table table-striped table-hover"
							value="#{deadPersonController.pageItems}" var="item"
							widgetVar="pageItemsTableWgVar">

							<p:ajax event="rowToggle"
								listener="#{deadPersonController.select(item)}" />

							<p:column styleClass="toggler" id="relatedFileToggler" width="30"
								exportable="false">
								<p:rowToggler />
							</p:column>


							<p:column styleClass="no-header table-actions-column" width="80">
								<span><p:commandLink
										actionListener="#{deadPersonController.delete(item)}"
										style="margin-left:5px;" update="tableId conter-top :messageScript"
										oncomplete="PF('pageItemsTableWgVar').filter()"
										styleClass="btn btn-danger waves-effect waves-light btn-xs ">
										<i class=" dripicons-trash  "
											style="color: white; font-size: 11px;" />
										<p:confirm header="#{bundle.delete}"
											message="#{bundle.are_you_sure_from_delete}">
										</p:confirm>
									</p:commandLink> <h:link outcome="dead-card"
										styleClass="btn btn-warning  waves-effect waves-light   btn-xs">
										<f:param name="id" value="#{item.id}" />
										<span class=" dripicons-document-edit  " style="color: white;" />
										<f:ajax></f:ajax>
									</h:link> </span>
							</p:column>


							<p:column filterBy="#{item.deadName}" filterMatchMode="contains"
								headerText="#{bundle.dead_person_fullName}"
								sortBy="#{item.deadName}" width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.dead_person_fullName}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="fullName" title="#{item.deadName}"
									value="#{item.deadName}" styleClass="text-ellipsis" />
							</p:column>

							<p:column filterBy="#{item.deadMotherName}"
								headerText="#{bundle.dead_mother_name}"
								sortBy="#{item.deadMotherName}" width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.dead_mother_name}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="deadMotherNameId" styleClass="text-ellipsis"
									title="#{item.deadMotherName}" value="#{item.deadMotherName}" />
							</p:column>

							<p:column filterBy="#{item.delegator}"
								headerText="#{bundle.dead_person_delegator}"
								sortBy="#{item.delegator}" width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.dead_person_delegator}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="livingArea" styleClass="text-ellipsis"
									title="#{item.delegator}" value="#{item.delegator}" />
							</p:column>

							<p:column filterBy="#{item.delegatorPhone}"
								headerText="#{bundle.dead_person_delegator_phone}"
								sortBy="#{item.delegator}" width="150">
								<f:facet name="filter">
									<p:inputText onkeyup="PF('pageItemsTableWgVar').filter()"
										placeholder="#{bundle.dead_person_delegator_phone}"
										styleClass="inputtext-filter" />
								</f:facet>
								<h:outputText id="phoneId" styleClass="text-ellipsis"
									title="#{item.delegatorPhone}" value="#{item.delegatorPhone}" />
							</p:column>

							<p:rowExpansion>
								<div class="card" style="margin-top: 10px;">
									<div class="card-body">
										<div class="row">
											<ul class="nav nav-pills mb-3 nav-justified" id="pills-tab"
												role="tablist">
												<li class="nav-item"><a class="nav-link active"
													id="general_chat_tab" data-toggle="pill"
													href="#general_chat">#{bundle.dead_needs}</a></li>
											</ul>
										</div>
										<div class="tab-pane fade active show" id="general_chat">

											<div class="row">
												<p:dataTable id="personNeedsTable"
													emptyMessage="#{bundle.no_records}"
													tableStyleClass=" table table-bordered mb-1"
													value="#{deadPersonController.deadPerson.deadNeedList}"
													var="needs">

													<p:column headerText="#{bundle.service_name}"
														sortBy="#{needs.service.name}" width="150">
														<h:outputText styleClass="text-ellipsis"
															value="#{needs.service.name}" />
													</p:column>

													<p:column headerText="#{bundle.person_needs_count}"
														sortBy="#{needs.count}" width="150">
														<h:outputText styleClass="text-ellipsis"
															value="#{needs.count}" />
													</p:column>

													<p:column headerText="#{bundle.person_needs_need_type}"
														sortBy="#{needs.needType.type}" width="150">
														<h:outputText styleClass="text-ellipsis"
															value="#{needs.needType.type}" />
													</p:column>

													<p:column headerText="#{bundle.person_needs_amount}"
														sortBy="#{needs.amount}" width="150">
														<h:outputText styleClass="text-ellipsis"
															value="#{needs.amount}" />
													</p:column>

													<p:column headerText="#{bundle.person_needs_currency}"
														sortBy="#{needs.currency.type}" width="150">
														<h:outputText
															style="font-size: 16px;font-weight: bold; padding: 4px !important; "
															styleClass="#{needs.currency eq 'DD' ? 'mb-0 p-2 bg-soft-success rounded':'mb-0 p-2 bg-soft-danger rounded '} "
															value="#{needs.currency.type}" />
													</p:column>
												</p:dataTable>
											</div>
										</div>
									</div>
								</div>
							</p:rowExpansion>

						</p:dataTable>
					</div>
				</h:panelGroup>
			</div>
		</div>
		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<h:commandLink value='#{bundle.yes}'
				style="margin-left:10px  ; margin-top:5px;  margin-bottom:5px; color: white;"
				styleClass="ui-confirmdialog-yes  btn btn-primary "
				icon="ui-icon-check">
				<f:ajax></f:ajax>
				<em class="fa fa-check" />
			</h:commandLink>
			<h:commandLink value='#{bundle.no}'
				style="color:white; margin-left:5px; margin-top:5px; margin-bottom:5px;"
				styleClass="ui-confirmdialog-no btn btn-danger">
				<em class="fa fa-times" />
				<f:ajax></f:ajax>
			</h:commandLink>
		</p:confirmDialog>

	</ui:define>
</ui:composition>

</html>
