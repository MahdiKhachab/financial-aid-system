<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	xmlns:f5="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/views/template/template.xhtml">
	<ui:param name="title" value='#{bundle.recieve_money}' />
	<ui:param name="subtitle" value='#{bundle.recieve_money}' />

	
	<ui:define name="breadcrumb">

		<li class="breadcrumb-item"><h:link outcome="home"> #{bundle.home} </h:link></li>
		<li class="breadcrumb-item active">#{bundle.services}</li>
		<li class="breadcrumb-item active">#{bundle.provide_aid}</li>
		<!--end col-->
	</ui:define>

	<ui:define name="customFormContent">
		<div class="sf-title">
			<span class="dripicons-forward sf-title__icon" aria-hidden="true"></span>
			<h1 class="sf-title__text m-0">#{bundle.provide_aid}</h1>
		</div>
		<nav class="sf-choice-grid" aria-label="#{bundle.provide_aid}">
			<h:link outcome="direct-submission-aid" styleClass="sf-choice">
				<span class="sf-choice__icon" aria-hidden="true"><i class="mdi mdi-send"></i></span>
				<span class="sf-choice__label">#{bundle.direct_submission}</span>
				<i class="sf-choice__arrow mdi mdi-chevron-left" aria-hidden="true"></i>
			</h:link>
			<h:link outcome="submit-with-repport-aid" styleClass="sf-choice">
				<span class="sf-choice__icon" aria-hidden="true"><i class="mdi mdi-filter-outline"></i></span>
				<span class="sf-choice__label">#{bundle.submit_with_conditions}</span>
				<i class="sf-choice__arrow mdi mdi-chevron-left" aria-hidden="true"></i>
			</h:link>
			<h:link outcome="submit-with-conditions-aid" styleClass="sf-choice">
				<span class="sf-choice__icon" aria-hidden="true"><i class="mdi mdi-clipboard-text-outline"></i></span>
				<span class="sf-choice__label">#{bundle.submit_with_repport}</span>
				<i class="sf-choice__arrow mdi mdi-chevron-left" aria-hidden="true"></i>
			</h:link>
			<h:link outcome="submit-rabit" styleClass="sf-choice">
				<span class="sf-choice__icon" aria-hidden="true"><i class="mdi mdi-account-group"></i></span>
				<span class="sf-choice__label">#{bundle.provide_aid_rabit}</span>
				<i class="sf-choice__arrow mdi mdi-chevron-left" aria-hidden="true"></i>
			</h:link>
			<h:link outcome="submit-company" styleClass="sf-choice">
				<span class="sf-choice__icon" aria-hidden="true"><i class="mdi mdi-domain"></i></span>
				<span class="sf-choice__label">#{bundle.provide_aid_company}</span>
				<i class="sf-choice__arrow mdi mdi-chevron-left" aria-hidden="true"></i>
			</h:link>
		</nav>
	</ui:define>
</ui:composition>
</html>
