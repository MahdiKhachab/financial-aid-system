<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" dir="rtl" lang="ar"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html">

<h:head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<h:outputStylesheet name="template/toastr-rtl.min.css" library="css" />

	<h:outputStylesheet name="bootstrap-datetimepicker.min.css"
		library="css" />
	<h:outputStylesheet name="bootstrap-timepicker.min.css" library="css" />

	<h:outputStylesheet name="template/bootstrap.min.css" library="css" />
	<h:outputStylesheet name="template/icons.min.css" library="css" />
	<h:outputStylesheet name="template/metisMenu.min.css" library="css" />
	<h:outputStylesheet name="template/general.css" library="css" />

	<h:outputStylesheet name="template/style.css" library="css" />
	<h:outputStylesheet name="select2/select2.min.css" library="plugins" />

	<!-- Design system: loaded after the theme so it can restyle it; page styles below still win -->
	<h:outputStylesheet name="design-system/tokens.css" library="css" />
	<h:outputStylesheet name="design-system/shell.css" library="css" />
	<h:outputStylesheet name="design-system/components.css" library="css" />

	<f:facet name="first">
		<h:outputScript library="primefaces" name="jquery/jquery.js" />
		<h:outputScript library="primefaces" name="jquery/jquery-plugins.js"></h:outputScript>
		<!-- PrimeFaces 15 ships jQuery 4; Migrate restores APIs the jQuery 3 era plugins use ($.trim, $.isArray, ...) -->
		<h:outputScript library="js" name="jquery-migrate-4.0.2.min.js" />
	</f:facet>
	<ui:insert name="customStyleSheet"></ui:insert>
<title>#{bundle.project_name}</title>  
</h:head>


<h:body>

	<a class="sf-skip-link" href="#sf-main">تخطَّ إلى المحتوى</a>

	<h:outputScript name="bootstrap.bundle.min.js" library="js" />






	<ui:insert name="customAjaxStatus">
		<p:ajaxStatus styleClass="sf-ajax-status">
			<f:facet name="start">
				<div class="sf-progress" aria-hidden="true"></div>
			</f:facet>
			<f:facet name="complete">
				<h:outputText value="" />
			</f:facet>
		</p:ajaxStatus>
	</ui:insert>
	<div class="topbar">


		<!-- Brand -->
		<div class="topbar-left">
			<h:link outcome="home" styleClass="sf-brand" title="#{bundle.project_name}">
				<span class="sf-brand__mark" aria-hidden="true"><i class="mdi mdi-charity"></i></span>
				<span class="sf-brand__name">#{bundle.project_name}</span>
			</h:link>
		</div>

		<!-- Navbar: menu toggle and the page breadcrumb (its last item is the current page) -->
		<nav class="navbar-custom">

		<ul class="list-unstyled topbar-nav mb-0">
			<li><h:form prependId="false">
					<button id="btnHideId" type="button" aria-label="القائمة"
						aria-controls="sf-sidebar"
						class="button-menu-mobile nav-link waves-effect waves-light hide-aside">
						<i class="dripicons-menu nav-icon" aria-hidden="true"></i>
					</button>
				</h:form></li>

		</ul>
		<div class="sf-topbar-breadcrumb">
			<ol class="breadcrumb">
				<ui:insert name="breadcrumb">
				</ui:insert>
			</ol>
		</div>
		</nav>
		<!-- end navbar-->
	</div>






	<h:form id="formTemplate" prependId="false">


		<div class="page-wrapper">
			<!-- Left Sidenav -->
			<div class="left-sidenav" id="sf-sidebar">
				<div class="main-icon-menu">
					<nav class="nav" aria-label="#{bundle.project_name}"> <ui:repeat var="menu"
						value="#{templateController.menu}">

						<a href="##{menu.href}" class="nav-link "
							data-toggle="tooltip-custom" data-placement="left"
							title="#{menu.itemLabel}" data-original-title="#{menu.itemLabel}"
							aria-label="#{menu.itemLabel}">
							<span class="#{menu.iconName}" aria-hidden="true" />
						</a>
					</ui:repeat> </nav>
				</div>
				<!--end main-icon-menu-->



				<div class="main-menu-inner">
					<div class="menu-body slimscroll">
						<ui:repeat var="menu" value="#{templateController.menu}">
							<div id="#{menu.href}" class="main-icon-menu-pane ">
								<div class="title-box">
									<h6 class="menu-title">#{menu.itemLabel}</h6>


								</div>

								<ul class="nav">
									<ui:repeat var="sub" value="#{menu.subMenuDetails}">
										<li class="nav-item "><h:link class="nav-link  "
												style="#{sub.styleClass}" outcome="#{sub.url}">
												<i class="#{sub.iconName}" />
											 #{sub.itemLabel}

											</h:link></li>
									</ui:repeat>
								</ul>
							</div>
						</ui:repeat>
						<!-- end Analytic -->
					</div>
				</div>
			</div>
			<main class="page-content" id="sf-main" tabindex="-1">
				<ui:insert name="customFormContent" />
			</main>

		</div>
		<div class="sf-backdrop" aria-hidden="true"></div>


	</h:form>






	<h:outputScript name="metisMenu.min.js" library="js" />

	<h:outputScript name="waves.min.js" library="js" />


	<h:outputScript name="jquery.slimscroll.min.js" library="js" />


	<h:outputScript name="app.js" library="js" />

	<h:outputScript name="template.js" library="js" />
	<h:outputScript name="design-system/shell.js" library="js" />

	<h:outputScript name="bootstrap-datepicker.js" library="js" />
	<h:outputScript name="locales/bootstrap-datepicker.ar.js" library="js" />
	<h:outputScript name="bootstrap-datetimepicker.min.js" library="js" />
	<h:outputScript name="locales/bootstrap-datetimepicker.ar.js"
		library="js" />
	<!-- template.js initDatePicker() also initialises .timepicker fields; its CSS was loaded, the script was not -->
	<h:outputScript name="bootstrap-timepicker.js" library="js" />
	<h:outputScript name="toastr.min.js" library="js" />
	<h:outputScript name="hot_key.js" library="js" />

	<h:outputScript name="input-spinner/js/bootstrap-input-spinner.js"
		library="plugins" />
	<h:outputScript name="select2/select2.min.js" library="plugins" />
	<!-- Yes/no switches: several pages initialise bootstrapToggle without including it (JSF renders it once) -->
	<h:outputStylesheet name="toggle/bootstrap-toggle.min.css" library="plugins" />
	<h:outputScript name="toggle/bootstrap-toggle.min.js" library="plugins" />
	<ui:insert name="customOutputScript"></ui:insert>



	<h:panelGroup id="messageScript">
		<h:outputScript rendered="#{not empty facesContext.messageList}">
			<ui:repeat value="#{templateController.messages}" var="message">
				generate("#{message.summary}","#{message.detail}");
			</ui:repeat>
		</h:outputScript>
	</h:panelGroup>
</h:body>


</html>
